[package]
name = "metered-api-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
dashmap = "5.5"
chrono = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
dotenv = "0.15"

[[bin]]
name = "metered-api-server"
path = "main.rs"
