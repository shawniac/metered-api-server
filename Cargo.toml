[package]
name = "metered-api-server"
version = "0.1.0"
edition = "2021"
authors = ["Jan Benda <contact@jbenda.de>"]
description = "A metered API server built with Warp and SQLx"
repository = "https://github.com/yourusername/metered-api-server"
license = "MIT"
keywords = ["api", "server", "metering", "warp", "rust"]


[dependencies]
warp = "0.3.7"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "macros", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
tower = "0.4"
